services:
  caddy:
    container_name: caddy
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  app:
    container_name: next.js
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
      - "5555:5555" # Prisma Studio
    environment:

      DATABASE_URL: postgresql://${POSTGRES_USER:-bdt}:${POSTGRES_PASSWORD:-bdt}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-bdt}?schema=public

      # Bungie Application info (set those in .env)
      BUNGIE_API_KEY: ${BUNGIE_API_KEY}
      BUNGIE_CLIENT_ID: ${BUNGIE_CLIENT_ID}
      BUNGIE_CLIENT_SECRET: ${BUNGIE_CLIENT_SECRET}

      NEXT_PUBLIC_BUNGIE_CLIENT_ID: ${BUNGIE_CLIENT_ID}
      SESSION_SECRET: ${SESSION_SECRET}

      # Proxy settings
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      NODE_OPTIONS: ${NODE_OPTIONS:-}

      # Application URL
      APP_URL: ${APP_URL:-https://localhost}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - db
      - caddy

  db:
    container_name: postgres
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bdt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bdt}
      POSTGRES_DB: ${POSTGRES_DB:-bdt}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Compose attend que Postgres soit réellement prêt avant de démarrer "app"
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bdt}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
